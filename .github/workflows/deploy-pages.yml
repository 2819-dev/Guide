# Deploys Guide to the Cloudflare Pages project "guide" (guidelearning.org).
# Pages direct upload — not a Workers deploy.
#
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions →
# New repository secret: CLOUDFLARE_API_TOKEN (permission: Account · Cloudflare Pages · Edit).
#
# - Push to main or the Claude working branch → production deploy
#   (guidelearning.org). Pages treats --branch=main as production.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/vibrant-pascal-cxfqm7]
  workflow_dispatch:

concurrency:
  group: pages-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE: guide
      NEXT_PUBLIC_GUIDE_URL: https://guidelearning.org
      NEXT_PUBLIC_AMUD_URL: https://guidelearning.org/amudsite
      NEXT_PUBLIC_ARCADE_URL: https://arcade-edu.guidelearning.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: |
          npx eslint .
          npx tsc --noEmit

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages@1

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a464339742f7a2946723614c52cb9522
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name=guide \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
